  <head>

    <meta name="twitter:image" content="https://eiretech360.com/og-image.png" />

      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Eire Tech",
        "description": "Digital Growth & Automation Partner",

        "image": "https://eiretech360.com/og-image.png",

        "contactPoint": {
          "@type": "ContactPoint",

          "telephone": "+353-89-942-7009",

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- WebP saves ~44% on the LCP poster. `type` keeps browsers without WebP
         support from preloading a file they cannot use — they fall through to
         the JPEG in the <picture> below. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/hero-mobile-01-poster.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/hero-desktop-01-poster.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      id="gf"
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      document.getElementById("gf").addEventListener("load", function () {
        this.media = "all";
      });
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <style>
      /* Holds this route's prerendered markup (see the prerender step in
         vite.static.config.ts). It overlays #root so React can mount and paint
         underneath, and src/main.tsx removes it once React has committed —
         createRoot() empties its container, so rendering into the content
         itself would blank the page for the length of the first render.

         Everything inside is styled by the same inlined Tailwind sheet as the
         React tree, so the two are visually identical and the swap is
         invisible. */
      #prerendered {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow-y: auto;
        overscroll-behavior: none;
        background: var(--bg, #ffffff);
      }
      /* The static fallback must be readable before JavaScript runs, including
         sections whose client-side entrance animation waits for scrolling. */
      #prerendered [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="prerendered"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
