<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eire Tech - Digital Growth & Automation Partner</title>
    <meta
      name="description"
      content="Eire Tech is a full-service digital solutions company helping businesses grow, automate, and innovate with web, marketing, apps, branding, and AI."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://eiretech360.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eire Tech" />
    <meta property="og:title" content="Eire Tech - Digital Growth & Automation Partner" />
    <meta
      property="og:description"
      content="Grow, automate, and innovate with one connected digital partner."
    />
    <meta property="og:url" content="https://eiretech360.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e9bf0" />
    <meta property="og:image" content="https://eiretech360.com/og-image.png" />
    <meta name="twitter:image" content="https://eiretech360.com/og-image.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- WebP saves ~44% on the LCP poster. `type` keeps browsers without WebP
         support from preloading a file they cannot use — they fall through to
         the JPEG in the <picture> below. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/hero-mobile-01-poster.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/hero-desktop-01-poster.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      id="gf"
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      document.getElementById("gf").addEventListener("load", function () {
        this.media = "all";
      });
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <style>
      /* The shell paints before React boots and src/main.tsx removes it once
         React has committed. It overlays #root instead of living inside it,
         because createRoot() empties its container — mounting used to blank the
         page for as long as the first render took. */
      #shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
      }
      .shell-fallback {
        min-height: 100vh;
        background: #05070a;
        color: #fff;
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .shell-fallback * {
        box-sizing: border-box;
      }
      .shell-nav {
        position: fixed;
        inset: 0 0 auto;
        z-index: 2;
        height: 80px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
        background: rgb(2 6 23 / 60%);
      }
      .shell-brand {
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      .shell-hero {
        position: relative;
        /* matches aspect-[9/19] on the React hero panel */
        aspect-ratio: 9 / 19;
        display: flex;
        align-items: end;
        overflow: hidden;
      }
      .shell-hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .shell-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgb(2 6 23 / 95%), rgb(2 6 23 / 45%), rgb(2 6 23 / 25%));
      }
      .shell-copy {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        /* px-6 pb-12 */
        padding: 0 24px 48px;
      }
      .shell-copy h1 {
        /* React's h1 mb-8 collapses with the empty <p>'s mb-10, so the gap
           down to the buttons resolves to 40px, not 72px. */
        margin: 0 0 40px;
        /* Deliberately a little above React's 48px. This h1 is the LCP element:
           it paints with the shell, long before React commits. Chrome only
           re-elects LCP when a later candidate is larger, so keeping this box
           bigger than React's headline pins LCP to the shell's paint. Matching
           48px exactly hands LCP to React's headline and pushes it out by ~4s. */
        font-size: 3.5rem;
        line-height: 0.92;
        letter-spacing: -0.05em;
        font-weight: 800;
      }
      .shell-copy span {
        background-image: linear-gradient(90deg, #0b6fc4, #1e9bf0 45%, #7cb342);
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
      }
      .shell-actions {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .shell-actions a {
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .shell-primary {
        background-image: linear-gradient(90deg, #0b6fc4, #1e9bf0 55%, #7cb342);
      }
      .shell-secondary {
        border: 1px solid rgb(255 255 255 / 35%);
      }
      @media (min-width: 768px) {
        .shell-nav {
          height: 92px;
          padding: 0 32px;
        }
        .shell-hero {
          /* md:aspect-[14/7] */
          aspect-ratio: 14 / 7;
        }
        .shell-copy {
          padding: 0 24px 80px;
        }
        .shell-copy h1 {
          font-size: 6rem;
        }
        .shell-actions {
          flex-direction: row;
        }
        .shell-actions a {
          width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="shell" class="shell-fallback">
      <div class="shell-nav">
        <div class="shell-brand">Eire Tech 360</div>
      </div>
      <main class="shell-hero">
        <picture>
          <source
            srcset="/src/assets/hero-desktop-01-poster.webp"
            media="(min-width: 768px)"
            type="image/webp"
          />
          <source srcset="/src/assets/hero-desktop-01-poster.jpg" media="(min-width: 768px)" />
          <source srcset="/src/assets/hero-mobile-01-poster.webp" type="image/webp" />
          <img src="/src/assets/hero-mobile-01-poster.jpg" alt="" fetchpriority="high" decoding="async" />
        </picture>
        <div class="shell-copy">
          <h1>Grow.<br /><span>Automate.</span><br />Innovate.</h1>
          <div class="shell-actions">
            <a class="shell-primary" href="/contact">Book a Free Consultation</a>
            <a class="shell-secondary" href="/services">Explore Our Services</a>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
