name: Build and deploy

# Runs when content or code changes on main, and when the content admin asks
# for a rebuild through the GitHub API.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "src/**"
      - "admin/**"
      - "public/**"
      - "index.html"
      - "contact/**"
      - "scripts/**"
      - "vite.config.ts"
      - "vite.static.config.ts"
      - "package.json"
      - "package-lock.json"
      # Changing how the deployment works should run it.
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was started"
        required: false
        default: "Manual"
      full_upload:
        description: "Upload every file, ignoring what the server thinks it already has"
        type: boolean
        required: false
        default: false

concurrency:
  # A second publish while one is running should replace it, not queue behind
  # it — the later content is the one that should win.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the site
        # Also runs scripts/verify-static.mjs, which fails the run if the built
        # HTML does not match content/ — so a bad edit never reaches the server.
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build the content admin
        # The admin ships inside the deploy, under the secret path in
        # ADMIN_PATH, so it is served from the same domain as the site.
        run: npm run build:admin
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ADMIN_GITHUB_REPO: ${{ github.repository }}

      # The upload action reports a missing host as "Input required and not
      # supplied: server", which says nothing about which secret to add. Check
      # first, and let the run finish either way: the built site is attached
      # below, so it is still useful before the FTP details exist.
      - name: Check the upload settings
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          # Prefer encrypted SFTP whenever its complete credential set exists.
          if [ -n "$SFTP_HOST$SFTP_PORT$SFTP_USER$SFTP_PASSWORD" ]; then
            missing_sftp=""
            [ -z "$SFTP_HOST" ] && missing_sftp="$missing_sftp SFTP_HOST"
            [ -z "$SFTP_PORT" ] && missing_sftp="$missing_sftp SFTP_PORT"
            [ -z "$SFTP_USER" ] && missing_sftp="$missing_sftp SFTP_USER"
            [ -z "$SFTP_PASSWORD" ] && missing_sftp="$missing_sftp SFTP_PASSWORD"
            if [ -n "$missing_sftp" ]; then
              echo "::error title=Incomplete SFTP setup::Add all four SFTP repository secrets:$missing_sftp"
              exit 1
            fi
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "transport=sftp" >> "$GITHUB_OUTPUT"
          else
          missing=""
          [ -z "$FTP_HOST" ] && missing="$missing FTP_HOST"
          [ -z "$FTP_USER" ] && missing="$missing FTP_USER"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"

          if [ -n "$missing" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Not uploading — these repository secrets are not set:$missing"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

          fi

          # A secret cannot be read from a step's `if`, so carry it as an output.
          if [ -n "$ADMIN_PATH" ]; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
            test -f "dist-static/$ADMIN_PATH/index.html" || { echo "::error::Admin index.html was not included in the build package"; exit 1; }
            test -f "dist-static/$ADMIN_PATH/api.php" || { echo "::error::Admin api.php was not included in the build package"; exit 1; }
          else
            echo "admin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Hostinger
        if: false
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist-static/
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/public_html/' }}
          # The action skips anything its manifest says is already there — and
          # will not create a directory it believes exists, which fails the
          # upload outright if the folder has since gone. Pointing at a name
          # with no manifest behind it makes the run treat the server as empty
          # and upload everything, without deleting anything.
          # Use a fresh manifest on every deployment so a stale FTP manifest
          # cannot skip the secret admin folder and leave a 404.
          state-name: .ftp-deploy-${{ github.run_id }}.json
          # Without this the action would delete anything on the server that
          # this build did not produce.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            # Hostinger rejects FTP rename/upload operations for dotfiles.
            # Keep the already-installed root and admin .htaccess files in
            # place while uploading the actual site and admin bundle.
            **/.htaccess

      - name: Direct upload to Hostinger
        if: steps.check.outputs.upload == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '/public_html/' }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          DEPLOY_TRANSPORT: ${{ steps.check.outputs.transport }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp sshpass

          if [ "$DEPLOY_TRANSPORT" = "sftp" ]; then
            # Hostinger occasionally drops the first connection from a fresh
            # GitHub runner. Retry a connection before declaring a deployment
            # failure; credentials and the existing site remain untouched.
            ssh_command() {
              SSHPASS="$SFTP_PASSWORD" sshpass -e ssh \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -p "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" "$@"
            }

            resolve_remote_dir() {
              local attempt remote
              for attempt in 1 2 3; do
                remote="$(ssh_command 'for candidate in "$HOME/public_html" "$HOME/domains/eiretech360.com/public_html"; do
                  if [ -d "$candidate" ]; then cd "$candidate" && pwd; exit 0; fi
                done
                find "$HOME" -maxdepth 6 -type d -path "*/eiretech360.com/public_html" -print -quit')" && [ -n "$remote" ] && {
                  printf '%s' "$remote"
                  return 0
                }
                echo "SSH folder check attempt $attempt/3 failed; retrying..." >&2
                sleep 10
              done
              return 1
            }

            # Hostinger SSH accounts do not always start inside the website
            # directory. Resolve the current domain's public_html folder over
            # SSH instead of guessing a path or silently creating one.
            remote_dir="$SFTP_REMOTE_DIR"
            if [ -z "$remote_dir" ]; then
              remote_dir="$(resolve_remote_dir)"
            fi

            if [ -z "$remote_dir" ]; then
              echo "::error title=Website folder not found::Could not locate eiretech360.com/public_html over SSH. Add SFTP_REMOTE_DIR with the absolute website path from SSH."
              exit 1
            fi

            # Stream the build through SSH instead of mapping an SSH filesystem
            # path back through SFTP. This preserves server-only .htaccess files
            # and avoids the slow per-file FTP/SFTP round trips.
            remote_dir_escaped="$(printf '%s' "$remote_dir" | sed "s/'/'\\\\''/g")"
            echo "Uploading the build over SSH to the verified website folder."
            uploaded=false
            for attempt in 1 2 3; do
              if tar -C dist-static --exclude='.htaccess' -cf - . | ssh_command "tar -xf - -C '$remote_dir_escaped'"; then
                uploaded=true
                break
              fi
              echo "SSH upload attempt $attempt/3 failed; retrying..." >&2
              sleep 10
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error title=Hostinger SSH unreachable::The SSH server did not accept the deployment after three attempts. Re-run the workflow; the live site was left unchanged."
              exit 1
            fi
            exit 0
          fi

          scheme="${FTP_PROTOCOL:-ftps}"
          if [ "$scheme" = "ftps" ]; then
            ssl_settings="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ssl:check-hostname no;"
          else
            ssl_settings="set ftp:ssl-force false; set ftp:ssl-protect-data false; set ssl:verify-certificate no; set ssl:check-hostname no;"
          fi

          # Upload directly. Hostinger rejects the hidden .in.* temporary-file
          # rename used by FTP-Deploy-Action.
          upload() {
            local transport="$1"
            local settings="$2"
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$transport://$FTP_HOST:$FTP_PORT" <<EOF
          $settings
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 60
          mirror --reverse --verbose --no-perms --no-umask --exclude-glob .htaccess ./dist-static/ "$FTP_REMOTE_DIR"
          bye
          EOF
          }

          # Some Hostinger FTP endpoints advertise FTP while the account is
          # configured as FTPS. Try the configured protocol first, then use
          # plain FTP when the server returns a TLS handshake error.
          upload "$scheme" "$ssl_settings" || upload "ftp" "set ftp:ssl-force false; set ftp:ssl-protect-data false; set ssl:verify-certificate no; set ssl:check-hostname no;"

      # The upload can report success while a folder never arrived, which then
      # only shows up as a 404 someone has to work backwards from. Ask the live
      # site whether the editor is actually being served.
      - name: Check the editor is live
        if: steps.check.outputs.upload == 'true' && steps.check.outputs.admin == 'true'
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          base="${SITE_URL:-https://eiretech360.com}"
          url="${base%/}/$ADMIN_PATH/api.php?action=session"

          for attempt in $(seq 1 12); do
            body=$(curl --silent --show-error --max-time 30 "$url" || true)
            if printf '%s' "$body" | grep -q '"signedIn"'; then
              echo "The editor answered at ${base%/}/$ADMIN_PATH/"
              exit 0
            fi
            echo "Editor check attempt $attempt/12 did not receive a session response; retrying..."
            sleep 5
          done

          echo "::error title=Editor not reachable::Uploaded, but ${base%/}/$ADMIN_PATH/ did not answer after retries."
          echo "What came back instead:"
          printf '%s' "$body" | head -c 300
          exit 1

      # Always attached, so the site can be uploaded by hand whenever the FTP
      # details are missing or the host is refusing connections.
      - name: Attach the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-static
          path: dist-static/
          retention-days: 14

      - name: Summary
        env:
          UPLOADED: ${{ steps.check.outputs.upload }}
          MISSING: ${{ steps.check.outputs.missing }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          {
            if [ "$UPLOADED" = "true" ]; then
              echo "### Deployed"
              echo ""
              echo "The site is live."
              if [ -n "$ADMIN_PATH" ]; then
                echo ""
                echo "Content editor: \`/$ADMIN_PATH/\`"
              fi
            else
              echo "### Built, but not uploaded"
              echo ""
              echo "These repository secrets are missing:$MISSING"
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions**,"
              echo "then run this workflow again."
              echo ""
              echo "In the meantime the built site is attached to this run as"
              echo "**dist-static** — download it and upload its contents by hand."
            fi
            echo ""
            echo "Reason: ${{ github.event.inputs.reason || 'push to main' }}"
            echo ""
            echo "Every page was checked against \`content/\` before this point."
          } >> "$GITHUB_STEP_SUMMARY"
