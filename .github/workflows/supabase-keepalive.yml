name: Supabase Keepalive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query keepalive row
        env:
          # These are the existing repository secrets used by the site build.
          # The old SUPABASE_* names were never configured, so scheduled runs
          # received empty values and failed before making the health query.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/keep_alive?id=eq.1&select=id,touched_at" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
