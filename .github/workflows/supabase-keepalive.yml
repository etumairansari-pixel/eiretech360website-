name: Supabase Keepalive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the Supabase contact endpoint
        env:
          # These are the existing repository secrets used by the site build.
          # The old SUPABASE_* names were never configured, so scheduled runs
          # received empty values and failed before making the health query.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          # The legacy keep_alive table is not present in the production
          # project (PostgREST returns 404). Exercise the deployed Edge
          # Function instead. An empty payload must be rejected with 400,
          # proving the project and function are awake without adding a fake
          # contact submission or sending an email.
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/functions/v1/submit-contact" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')"

          if [ "$status" != "400" ]; then
            echo "Unexpected Supabase contact-endpoint status: $status"
            cat response.json
            exit 1
          fi
